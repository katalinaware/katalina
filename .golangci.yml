run:
  timeout: 20m
  tests: true
  skip-dirs-use-default: true
  skip-files:


linters:
  disable-all: true
  enable:
    - goconst
    - goimports
    - gosimple
    - govet
    - ineffassign
    - misspell
    - unconvert
    - typecheck
    - unused
    - staticcheck
    - bidichk
    - durationcheck
    - exportloopref
    - whitespace
    - nilerr
    - gocritic
    - ineffassign
    - unparam
    - unused
    - grouper
    - gofmt
    - unconvert
    - stylecheck

linters-settings:
  gofmt:
    simplify: true
  goconst:
    min-len: 3
    min-occurrences: 6